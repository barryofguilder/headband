# Render Blueprint for the Headband static site.
#
# The game is reached at barryofguilder.com/headband/ through rewrite rules on
# the barryofguilder site, which live in that repo's render.yaml. See the
# Deploying section of CLAUDE.md.
#
# Render matches this to the existing "headband" service by name, so the
# headband-mqcf.onrender.com address stays the same.
services:
  - type: web
    runtime: static
    name: headband
    branch: master
    # Deploy only after the GitHub checks (lint and tests, in
    # .github/workflows/ci.yml) pass.
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    # Render gets the Node version from "engines" in package.json, which is
    # pinned to the same version as Volta.
    envVars:
      # The path the browser sees. See config/environment.js.
      - key: ROOT_URL
        value: /headband/
    routes:
      # Render serves real files before applying these rules.
      #
      # A missing asset (like an old hashed file after a deploy) gets a 404
      # instead of index.html, which would fail with a MIME type error.
      - type: rewrite
        source: /assets/*
        destination: /assets/
      # Every page of the game is served by index.html, so deep links and
      # reloads work.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Render doesn't know this file type and sends it as binary.
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      # Phones check for a new version of the game on every visit.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
