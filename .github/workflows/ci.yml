name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Render waits for these checks to pass before deploying (render.yaml uses
# autoDeployTrigger: checksPass).
jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          # Reads the Volta pin ("volta.node") from package.json.
          node-version-file: package.json
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          # Reads the Volta pin ("volta.node") from package.json.
          node-version-file: package.json
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test
